android:
  # 电视设备的 adb ID（示例为通过网络连接的设备，请根据实际情况修改或用命令行参数覆盖）
  deviceId: "192.168.1.xxx:5555"
  # 如需在进入首页前自动启动 App，可配置包名，例如：
  # launch: com.example.tvapp

agent:
  # 在调用 aiAct 时发送给 AI 模型的背景知识
  aiActContext: "这是 Android TV 设备，使用遥控器方向键移动焦点（通过高亮框判断位置），Enter 键确认，Back 键返回。根据界面布局判断需要按几次方向键到达目标。"

tasks:
  - name: 验证"看电视"首页视频小窗播放+电视剧播放正常
    flow:
      # 前置条件：已进入"看电视"界面
      # 1. 检查初始状态：位于"看电视"导航栏，屏幕中间小窗播放正常
      - aiAssert: >
          当前位于"看电视"导航栏，屏幕中间小窗正在正常播放，无卡顿。含有多个内容的卡片会以翻转的形式切换。
      - sleep: 5000 # 观察小窗播放一段时间

      # 2. 切换至影视首页，点击"电视剧"进入电视剧首页
      - ai: >
          当前位于"看电视"导航栏。请使用遥控器方向键移动焦点，直到找到并切换到“影视首页”。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次方向键。
      - sleep: 2000
      - aiAssert: >
          已成功切换至影视首页。
      - ai: >
          当前在影视首页。请使用遥控器方向键移动焦点，直到找到并点击“电视剧”入口，进入电视剧专区。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次方向键。
      - sleep: 2000
      - aiAssert: >
          已成功进入电视剧专区。

      # 3. 在电视剧专区寻找并点击节目“韶华若锦”
      - ai: >
          当前在电视剧专区。请使用遥控器方向键移动焦点，在页面中寻找名为“韶华若锦”的节目。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次方向键来浏览和查找。
          找到后，请点击进入该电视剧的详情页。
      - sleep: 2000
      - aiAssert: >
          已成功进入电视剧“韶华若锦”的详情页，默认焦点落于左上角小窗，小窗内容正常播放。

      # 4. 验证焦点停留在左上角小窗超过30秒会自动切换至全屏播放
      - sleep: 35000 # 等待35秒，超过30秒的触发条件
      - aiAssert: >
          焦点停留在左上角小窗超过30秒后，已自动切换至全屏播放模式。