android:
  # 电视设备的 adb ID（示例为通过网络连接的设备，请根据实际情况修改或用命令行参数覆盖）
  deviceId: "192.168.1.xxx:5555"
  # 如需在进入“看电视”界面前自动启动 App，可配置包名，例如：
  # launch: com.example.tvapp

agent:
  # 在调用 aiAct 时发送给 AI 模型的背景知识
  aiActContext: "这是 Android TV 设备，使用遥控器方向键移动焦点（通过高亮框判断位置），Enter 键确认，Back 键返回。根据界面布局判断需要按几次方向键到达目标。"

tasks:
  - name: 验证"看电视"首页视频小窗播放+免费专区返回键功能正常
    flow:
      # 前置条件：已进入"看电视"界面
      # 1. 检查初始状态
      - aiAssert: >
          初始位于"看电视"导航栏，焦点高亮显示正常。屏幕中间小窗播放正常无卡顿。含有多个内容的卡片会以翻转的形式切换。
      - sleep: 3000

      # 2. 切换至免费专区
      - ai: >
          当前焦点在"看电视"导航栏上。请使用遥控器方向键（向上、向下、向左、向右）移动焦点，直到焦点落在"免费专区"或"免费"导航栏上。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次方向键。
      - sleep: 2000
      - aiAssert: >
          焦点已成功移动到"免费专区"或"免费"导航栏上，焦点高亮正常显示。

      # 3. 进入免费专区页面（按OK键确认）
      - aiKeyboardPress: Enter
      - sleep: 2000

      # 4. 在免费专区页面内寻找并点击指定节目
      - ai: >
          当前焦点在"免费专区"页面内。请使用遥控器方向键（向上、向下、向左、向右）移动焦点，直到你在页面中找到名为“密林深处·寻找驯鹿”的节目。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次方向键，直到成功将焦点移动到这个节目上。
      - sleep: 500
      - aiAssert: >
          在免费专区页中，焦点已移动到这个名为“密林深处·寻找驯鹿”的节目上，焦点高亮正常显示。
      - aiKeyboardPress: Enter
      - sleep: 2000

      # 5. 验证报错及处理
      - aiAssert: >
          点击进入节目后，界面显示错误码为"52043-2"。
      - ai: >
          当前界面显示错误码"52043-2"。请找到并点击“知道了”按钮。
      - sleep: 2000
      - aiAssert: >
          点击“知道了”按钮后，已正确返回至原焦点位置（即“密林深处·寻找驯鹿”节目上）。

      # 6. 点击第一次返回键
      - runAdbShell: input keyevent 4
      - sleep: 2000
      - aiAssert: >
          点击返回键后，焦点已切换至"免费"导航栏。

      # 7. 点击第二次返回键
      - runAdbShell: input keyevent 4
      - sleep: 2000
      - aiAssert: >
          再次点击返回键后，焦点已切换至"看电视"导航栏。屏幕中间的小窗仍然播放正常，无卡顿。