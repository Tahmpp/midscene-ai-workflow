android:
  # 电视设备的 adb ID（示例为通过网络连接的设备，请根据实际情况修改或用命令行参数覆盖）
  deviceId: "192.168.1.xxx:5555"
  # 如需在进入首页前自动启动 App，可配置包名，例如：
  # launch: com.example.tvapp

agent:
  # 在调用 aiAct 时发送给 AI 模型的背景知识
  aiActContext: "这是 Android TV 设备，使用遥控器方向键移动焦点（通过高亮框判断位置），Enter 键确认，Back 键返回。根据界面布局判断需要按几次方向键到达目标。"

tasks:
  - name: 验证"看电视"首页视频小窗播放+电视剧播放正常
    flow:
      # 前置条件：已进入电视剧详情页，且该电视剧集数大于等于16集。
      # 1. 左右滑动电视剧集数。
      - ai: >
          当前焦点在电视剧详情页的集数列表上。请使用遥控器方向键（向左、向右）滑动电视剧集数列表。
          你需要自己判断当前焦点位置，并左右滑动以浏览集数。
      - sleep: 2000
      - aiAssert: >
          左右滑动电视剧集数，无卡顿现象出现。
      
      # 2. 选中第16集点击。
      - ai: >
          请使用遥控器方向键（向左、向右）移动焦点，直到选中第16集。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次方向键，直到成功将焦点移动到第16集上。
      - sleep: 500
      - aiKeyboardPress: Enter
      - sleep: 3000
      - aiAssert: >
          选中第16集，点击后直接进入全屏播放，屏幕中间显示"即将为您播放 XXX(电视剧名) 第16集"。
      
      # 3. 检查播放状态与返回
      - sleep: 5000 # 等待加载
      - aiAssert: >
          加载完成后屏幕中显示"已为您跳过片头"并在下方正常显示播控栏。
      - sleep: 5000 # 等待5秒后播控栏消失
      - aiAssert: >
          等待5秒后播控栏消失。
      # 按下返回键后正确返回电视剧详情页，焦点落于左上角小窗。
      - runAdbShell: input keyevent 4
      - sleep: 2000
      - aiAssert: >
          按下返回键后正确返回电视剧详情页，焦点落于左上角小窗。
      
      # 4. 遥控器点击首页键，焦点切换至"看电视"导航栏，屏幕中小窗仍然播放正常。
      - runAdbShell: input keyevent 3 # KEYCODE_HOME
      - sleep: 2000
      - aiAssert: >
          遥控器点击首页键，焦点切换至"看电视"导航栏。
      - sleep: 3000
      - aiAssert: >
          屏幕中小窗仍然播放正常。