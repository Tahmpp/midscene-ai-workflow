android:
  # 电视设备的 adb ID（示例为通过网络连接的设备，请根据实际情况修改或用命令行参数覆盖）
  deviceId: "192.168.1.xxx:5555"
  # 如需在进入首页前自动启动 App，可配置包名，例如：
  # launch: com.example.tvapp

agent:
  # 在调用 aiAct 时发送给 AI 模型的背景知识
  aiActContext: "这是 Android TV 设备，使用遥控器方向键移动焦点（通过高亮框判断位置），Enter 键确认，Back 键返回。根据界面布局判断需要按几次方向键到达目标。"

tasks:
  - name: 首页焦点与小窗播放检查
    flow:
      # 1. 检查默认焦点是否在"首页"
      - aiAssert: >
          当前电视主界面上，默认焦点落在"首页"入口上，焦点高亮显示正常。
      
      # 2. 检查首页左下角视频小窗播放是否正常
      - sleep: 3000
      - aiAssert: >
          首页左下角的视频小窗正在正常播放内容，画面清晰、无黑屏、无明显卡顿或长时间停帧现象。

  - name: 免费专区模块焦点与返回路径检查
    flow:
      # 1. 从首页移动到免费专区模块入口（让模型自己判断需要按几次方向键）
      - ai: >
          当前焦点在"首页"入口上。请使用遥控器方向键（向上、向下、向左、向右）移动焦点，
          直到焦点落在"免费专区"模块入口或"免费专区"卡片上。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次向下键、几次向右键等，
          直到成功将焦点移动到"免费专区"模块上。
      - sleep: 2000
      - aiAssert: >
          焦点已成功移动到"免费专区"模块入口上，焦点高亮正常显示，且当前焦点确实落在"免费专区"相关的入口或卡片上。
      
      # 2. 进入免费专区模块（按OK键确认）
      - aiKeyboardPress: Enter
      - sleep: 2000
      - aiAssert: >
          已成功进入“免费专区”页，默认焦点正确落在左上角第一个卡片上，焦点高亮正常显示。
      
      # 3. 测试免费专区页内正确寻找卡片
      - ai: >
          当前焦点在"免费专区"页左上角第一个卡片上。请使用遥控器方向键（向上、向下、向左、向右）移动焦点，
          直到你在"免费专区"页内找到一部名为“江湖正道”的剧。
          你需要自己判断当前焦点位置，并根据界面布局决定需要按几次向下键、几次向右键等，这部剧可能一开始并不在页面的展示中，因此需要你额外向下移动焦点来改变页面内容。
          直到成功将焦点移动这个名为“江湖正道”的剧上。
      - sleep: 500
      - traditionalVisionAssert:
          category: tv_series
          target: 江湖正道
          minScore: 0.78
          topK: 3
      
      # 4. 按返回键返回免费专区页最上方（使用 ADB 发送返回键事件，keycode 4 = KEYCODE_BACK）
      - runAdbShell: input keyevent 4
      - sleep: 2000
      - aiAssert: >
          已成功返回到免费专区页最上方，返回后焦点应落于页面左上角第一个卡片上，不应停留在异常位置或其他无关模块。
      # 5. 再次点击返回键返回首页（使用 ADB 发送返回键事件，keycode 4 = KEYCODE_BACK）
      - runAdbShell: input keyevent 4
      - sleep: 2000
      - aiAssert: >
          已成功返回到首页界面，返回后焦点应落于原焦点位置，不应停留在异常位置或其他无关模块。
      # 6. 再次点击返回键返回首页（使用 ADB 发送返回键事件，keycode 4 = KEYCODE_BACK）
      - runAdbShell: input keyevent 4
      - sleep: 2000
      - aiAssert: >
          已成功返回到首页界面，返回后焦点应落于首页最上方“首页”入口上，不应停留在异常位置或其他无关模块。   

